<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central InclusiVR</title>
  <meta name="description" content="Consulta visual do workspace InclusiVR no Notion: projetos, tarefas, atas, contatos e documentos.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#view">Pular para o conteúdo</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#inicio" aria-label="Central InclusiVR — início">
        <span class="brand-badge"><img src="assets/logo.png" alt=""></span>
        <span class="brand-text">Inclusi<b>VR</b><small>Central do Notion</small></span>
      </a>

      <nav class="nav" id="nav" aria-label="Seções">
        <a href="#inicio" data-view="inicio">Início</a>
        <a href="#projetos" data-view="projetos">Projetos</a>
        <a href="#tarefas" data-view="tarefas">Tarefas</a>
        <a href="#atas" data-view="atas">Atas</a>
        <a href="#contatos" data-view="contatos">Contatos</a>
        <a href="#documentos" data-view="documentos">Documentos</a>
        <a href="#equipe" data-view="equipe">Equipe</a>
      </nav>

      <div class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar no Notion…" autocomplete="off"
               aria-label="Buscar em todo o conteúdo" aria-controls="search-results" aria-expanded="false">
        <kbd>/</kbd>
        <div class="search-results" id="search-results" role="listbox" hidden></div>
      </div>

      <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>Inclusi<b>VR</b> · Central do Notion</span>
      <span id="footer-meta"></span>
    </div>
  </footer>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-scroll" id="drawer-body"></div>
  </aside>

  <script src="data/notion-data.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
